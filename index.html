<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>将棋AI・AI感想戦</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>♟ 将棋AI・AI感想戦</h1><p>ブラウザだけで遊べる将棋サイト</p></header>
<main>
<section class="game">
  <div class="topbar"><button id="newGame">新しい対局</button><label>AI強さ <select id="depth"><option value="1">入門</option><option value="2" selected>初級</option><option value="3">中級</option></select></label><span id="turn">先手の番</span></div>
  <div class="captured"><div><b>後手の持ち駒</b><div id="handGote"></div></div></div>
  <div id="board" aria-label="将棋盤"></div>
  <div class="captured"><div><b>先手の持ち駒</b><div id="handSente"></div></div></div>
  <div class="actions"><button id="undo">一手戻す</button><button id="aiMove">AIに指させる</button><button id="review">AI感想戦</button></div>
</section>
<aside>
  <h2>棋譜</h2><ol id="moves"></ol>
  <h2>AI感想戦</h2><div id="reviewBox" class="review">対局後に「AI感想戦」を押してください。</div>
</aside>
</main>
<footer>GitHub Pages向け・サーバー不要 / AIはブラウザ内で動作</footer>
<script src="app.js"></script>
</body></html>
